[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "velocity"
version = "0.1.0"
description = "初中物理速度与平均速度计算工具，支持练习纸生成"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["python", "education", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Natural Language :: Chinese (Simplified)",
]

[project.scripts]
velocity = "velocity.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/velocity"
Source = "https://github.com/eastyou/velocity"

[tool.setuptools]
packages = ["velocity"]
